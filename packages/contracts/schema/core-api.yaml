openapi: 3.1.0
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
info:
  title: 长期科研协作工作台核心接口
  version: 1.0.0
  description: 本合同定义v1核心接口和不可改变的不变量，不是已实现服务。全部持久化通过单一SQLite事务服务；events表为真源，当前表为事务内投影。外部JSONL、Markdown、快照为导出。所有状态与身份由服务器验证；新增接口不得绕过用户授权、版本、项目隔离和溯源约束。
servers:
- url: http://127.0.0.1:37641
  description: 建议本地开发监听地址；生产端口可配置。只绑定loopback，仍需认证与Origin校验。
security:
- userSession: []
- serviceToken: []
tags:
- name: Core
  description: 项目级核心合同
paths:
  /v1/projects:
    get:
      operationId: listProjects
      summary: 列出当前身份可见项目
      description: ''
      parameters:
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/Limit'
      security:
      - userSession: []
      - serviceToken: []
      x-allowed-principal-kinds:
      - human
      - service
      responses:
        '200':
          description: 成功。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EntityList'
        '400':
          description: 请求schema不合法。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: 缺少或无效认证。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: 身份或授权范围不足。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: 项目或实体不存在，或不属于当前可见范围。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: 项目或目标修订、幂等内容、活动执行占用等冲突；不得部分提交。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: 输入结构合法，但领域关系、状态转换、内容摘要或范围规则不成立；附可操作说明。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: 速率或用户预算限制；保留输入和原始记录。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          headers:
            Retry-After:
              description: 可确定重试时间时返回秒数；用户预算耗尽且需变更预算时可省略。
              schema:
                type: integer
                minimum: 0
        '501':
          description: 当前连接不支持或尚未核验所需能力。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: 依赖不可用；明确是否已入队，不重放未知副作用。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      operationId: createProject
      summary: 创建项目及初始路线
      description: 由用户明确设定目标；生成Project、初始Branch及事件，单事务提交。
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      security:
      - userSession: []
        csrfToken: []
      x-allowed-principal-kinds:
      - human
      responses:
        '201':
          description: 成功。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommandReceipt'
        '400':
          description: 请求schema不合法。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: 缺少或无效认证。
