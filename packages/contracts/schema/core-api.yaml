components:
  schemas:
    Error:
      type: object
      properties:
        code:
          type: string
          enum:
          - unauthenticated
          - forbidden
          - not_found
          - revision_conflict
          - idempotency_conflict
          - invalid_transition
          - invalid_graph
          - invalid_scope
          - source_unavailable
          - resync_required
          - capability_unsupported
          - capability_unverified
          - validation_failed
          - dependency_unavailable
          - rate_limited
          - budget_exceeded
        message:
          type: string
          minLength: 1
        request_id:
          type: string
          minLength: 1
        current_revision:
          anyOf:
          - type: integer
            minimum: 1
          - type: 'null'
        retryable:
          type: boolean
        details:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
              reason:
                type: string
                minLength: 1
            required:
            - field
            - reason
            additionalProperties: false
          minItems: 0
      required:
      - code
      - message
      - request_id
      - current_revision
      - retryable
      - details
      additionalProperties: false
    CommandReceipt:
      type: object
      properties:
        command_id:
          type: string
          description: 稳定且项目内唯一的可读前缀标识；重命名不改变标识。
          pattern: ^[a-z]{3}_[A-Za-z0-9][A-Za-z0-9._-]{0,95}$
        project_id:
          type: string
          description: 稳定且项目内唯一的可读前缀标识；重命名不改变标识。
          pattern: ^[a-z]{3}_[A-Za-z0-9][A-Za-z0-9._-]{0,95}$
        project_revision:
          type: integer
          minimum: 1
        status:
          type: string
          enum:
          - applied
          - queued
          - accepted
        event_ids:
          type: array
          items:
            type: string
            description: 稳定且项目内唯一的可读前缀标识；重命名不改变标识。
            pattern: ^[a-z]{3}_[A-Za-z0-9][A-Za-z0-9._-]{0,95}$
          minItems: 0
        result_entity_ids:
          type: array
          items:
            type: string
            description: 稳定且项目内唯一的可读前缀标识；重命名不改变标识。
            pattern: ^[a-z]{3}_[A-Za-z0-9][A-Za-z0-9._-]{0,95}$
          minItems: 0
        message:
          type: string
        request_id:
          type: string
          minLength: 1
      required:
      - command_id
      - project_id
      - project_revision
      - status
      - event_ids
      - result_entity_ids
      - message
      - request_id
      additionalProperties: false
      description: accepted/queued仅表示接收；执行终态需事件确认。相同幂等键同请求返回原回执。
    CommandStatus:
      type: object
      properties:
        command_id:
          type: string
          description: 稳定且项目内唯一的可读前缀标识；重命名不改变标识。
          pattern: ^[a-z]{3}_[A-Za-z0-9][A-Za-z0-9._-]{0,95}$
        project_id:
          type: string
          description: 稳定且项目内唯一的可读前缀标识；重命名不改变标识。
          pattern: ^[a-z]{3}_[A-Za-z0-9][A-Za-z0-9._-]{0,95}$
        status:
          type: string
          enum:
          - accepted
          - queued
          - running
          - succeeded
          - failed
          - cancelled
          - unknown
        submitted_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        result_entity_ids:
          type: array
          items:
            type: string
            description: 稳定且项目内唯一的可读前缀标识；重命名不改变标识。
            pattern: ^[a-z]{3}_[A-Za-z0-9][A-Za-z0-9._-]{0,95}$
          minItems: 0
        event_ids:
          type: array
          items:
            type: string
            description: 稳定且项目内唯一的可读前缀标识；重命名不改变标识。
            pattern: ^[a-z]{3}_[A-Za-z0-9][A-Za-z0-9._-]{0,95}$
          minItems: 0
        error:
          anyOf:
          - $ref: '#/components/schemas/Error'
          - type: 'null'
        status_note:
          type: string
      required:
      - command_id
      - project_id
      - status
      - submitted_at
      - updated_at
      - result_entity_ids
      - event_ids
      - error
      - status_note
      additionalProperties: false
      description: 异步派生或会话启动请求的处理状态，供SSE中断后查询。succeeded只表示该请求处理成功，不等于科研目标完成。此技术任务不投影为探索图节点。
