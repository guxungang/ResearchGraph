        description: 稳定且项目内唯一的可读前缀标识；重命名不改变标识。
        pattern: ^[a-z]{3}_[A-Za-z0-9][A-Za-z0-9._-]{0,95}$
      description: 项目隔离边界；授权必须覆盖该项目。
    EntityId:
      name: entity_id
      in: path
      required: true
      schema:
        type: string
        description: 稳定且项目内唯一的可读前缀标识；重命名不改变标识。
        pattern: ^[a-z]{3}_[A-Za-z0-9][A-Za-z0-9._-]{0,95}$
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 8
        maxLength: 128
      description: 同principal+project+operation下唯一；同键同请求返回原结果，同键不同请求返回409。
    Cursor:
      name: cursor
      in: query
      required: false
      schema:
        type: string
      description: 服务端返回的不可解读游标，不允许跨项目复用。
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
  securitySchemes:
    userSession:
      type: apiKey
      in: cookie
      name: research_session
      description: 本地用户会话；HttpOnly、SameSite、随机会话凭证。网络隔离不能替代身份认证。
    csrfToken:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: 用户写入请求必须匹配会话CSRF令牌及允许Origin。
    serviceToken:
      type: http
      scheme: bearer
      description: 登记适配器或MCP服务凭证；服务器绑定principal kind、project和scope。不得当作human身份。
x-mcp-surface:
  version: 1.0.0
  tools:
  - name: project_context
    purpose: 读取已构建ContextBundle或请求受限派生；不修改批准状态。
    mapped_operations:
    - getContextBundle
    - buildContext
  - name: project_recall
    purpose: 项目范围内检索；结果带有效性和来源。
    mapped_operations:
    - recallProject
  - name: project_reading_brief
    purpose: 读取或生成解释材料；不能替用户标记读懂。
    mapped_operations:
    - getReadingBrief
    - createReadingBrief
  - name: project_submit_proposal
    purpose: 仅提交候选变化。
    mapped_operations:
    - submitProposal
  forbidden:
  - applyProposal
  - createGrant
  - revokeGrant
  - createReview
  - startManagedSession
  - interruptSession
  - direct_database_write
  note: MCP工具列表不等于调用授权；所有请求继续由服务端验证身份、scope与版本。
x-revision-semantics:
  semantic_revision: Project.revision仅在有效研究状态或授权改变时递增。目标、约束、当前路线、已采用决定、主张评估、有效关系、研究单元状态与Grant是语义变更。
  operational_revision: 原始事件、会话运行状态、实验心跳/指标、候选提案、ContextBundle、ReadingBrief仅递增各自实体revision与event_seq，不推进Project.revision。将运行结果正式纳入证据或采用其科学结论才是语义变更。
  event_sequence: 每条成功提交的canonical event获得新event_seq；不同事件可有相同project_revision_after。完整事件的after_entities足以重建投影。
  proposal_apply: Proposal.base_project_revision是原始输入快照。提交Proposal本身不改变Project.revision。apply检查当前请求expected_revision与target_revision_refs；输入较旧但目标和约束均未变化的提案可以在显式重校验后应用，不要求模型盲目重跑。
  exceptions: 原始采集的expected_revision只作来源关联；派生内容的expected_revision固定输入快照。二者不得执行业务状态变化，旧结果明确标注版本。
x-internal-policy-application:
  entrypoint: applyAuthorizedProposal
  exposed_over_http: false
  exposed_to_mcp: false
  caller: 内部确定性策略服务；不能由模型以serviceToken直接调用。
  requirements:
  - 引用已由用户明确授权且仍有效的Grant。
  - Grant.subject_principal_ids必须包含内部服务；actions和scope覆盖全部commands。
  - 常规变化可用policy_within_scope；目标、关键假设、主线和重要选择的自动应用必须policy_exact_proposal并绑定提案精确版本。
  - 授权来源必须是当前用户的明确UI动作或经已登记活跃连接认证的明确user消息；旧聊天导入或assistant转述不自动产生授权。
  - 在事务中检查Project与目标版本、命令范围、Grant有效性、关系与状态；授权内容变化时不自动扩大。
  - 成功后Event.actor.kind=service、actor.grant_id指向原授权；不能伪装为human。
  on_ambiguity: 保留候选并要求用户针对真正缺失的选择澄清；不为已经明确授权的同一范围重复询问。
x-domain-command-contracts:
  create_claim: 生成新Claim，assessment=unassessed；不能凭创建动作标supported。
  revise_claim: 保留旧修订，创建新revision。hypothesis/assumption内容变更按assumption.change治理；其他类型按claim.revise。新修订原有证据边标needs_revalidation。
  create_evidence: 来源存在性与hash由服务端检查，初始verification_status=not_checked。可缺资料但availability必须如实；人工陈述不得伪装论文或实验。
  revise_evidence: 保留旧修订和定位，新资料创建新revision，已有精确证据关系不自动继承。
  revise_research_unit: 修改问题、解释或完成条件，保留原修订；已finished单元的实质问题/条件改变须在同批命令中显式重开或给出新的完成依据，不能静默沿用旧completion。
  split_research_unit: 没有活跃绑定时创建多个新单元，旧单元archived，保留原始事件和消息关联；添加旧单元到新单元的reorganizes_to边。资料可以多重引用，不能复制成新的独立证据。
  merge_research_units: 要求同分支且所有源单元无活跃绑定；创建新单元、归档源单元、添加reorganizes_to边；不合并或删除原始证据身份。
  merge_branches_selectively: 按selected_entity_refs的具体修订建新proposed分支并产生导入对应关系；原分支不变，不自动设主线。冲突决策有显式resolution或保留待定，不宣称自动解决科学矛盾。
  correct_graph_edge: 保留旧关系修订，验证端点类型/修订/项目/无环约束后生成新修订；不得把仅时间相邻的活动改成已证实因果。
  relation_semantics: continues_to是身份谱系，其余关系精确绑定端点revision；reorganizes_to只表达单元整理，不算科研进展。continues_to和reorganizes_to的联合谱系及depends_on各自要求无环。
